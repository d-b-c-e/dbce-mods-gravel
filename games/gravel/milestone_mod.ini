; Milestone telemetry mod - Gravel (Steam, UE 4.17)
; Copy this beside gravel-Win64-Shipping.exe together with dinput8.dll.

[proxy]
; DirectInput product key = (PID << 16) | VID. MOZA R12 base = 0006346e.
; This is also the section name Gravel uses in WheelConfig.ini.
product=0006346e
; Report the device as DI8DEVTYPE_DRIVING so the game offers it as a wheel.
retype=1
; Write milestone_mod.log beside the exe.
log=1

[telemetry]
enabled=1
host=127.0.0.1
port=5300
; Optional second destination, e.g. tools/forza_listen.py while SimHub holds 5300.
mirror_port=0
; fm7 = Forza Motorsport 7 "car dash" packet (311 B). fh4 = Horizon 4/5 (324 B). sled = v1 (232 B).
format=fm7
rate=60
; auto = IsRaceOn follows whether a live vehicle is being read. always = 1.
race_on=auto

[input]
; Which DIJOYSTATE axis carries each control. Names: lX lY lZ lRx lRy lRz slider0 slider1.
; MOZA R12 measured 2026-08-29: steer X, throttle Z, brake Rz, handbrake slider0.
steer=lX
throttle=lZ
brake=lRz
handbrake=slider0
clutch=

[ffb]
gain=1.0

[fmod]
; Log every distinct FMOD parameter name the game sets, with its range.
discover=1
; Gravel drives its engine audio from real physics, so these ARE the telemetry.
; Measured ranges in a race: VehicleSpeed 0..0.70, LongitudinalSlip -0.51..1,
; LateralSlip 0..0.60, SuspensionMovement 0..1, torque 0..1, BrakingForce 0..1.
; Gravel sets no RPM parameter - RPM comes from the UE4 HUD widget instead.
rpm=RPM
load=torque
speed=VehicleSpeed
lateral_slip=LateralSlip
longitudinal_slip=LongitudinalSlip
suspension=SuspensionMovement
braking=BrakingForce
; Collision events. FMOD sets these only when a crash sound fires (a few
; hundred calls a race vs ~175k for VehicleSpeed), so they are the impact
; signal. Each hit becomes a decaying spike on longitudinal acceleration.
impact=Intensity
impact_velocity=Speed
; Peak m/s^2 at full collision speed, and the decay time of the spike.
; Intensity is near-binary in practice (median 1.0 over 368 measured hits),
; so collision speed carries the magnitude. Raise impact_gain if hits feel
; weak - no rebuild needed, the ini is read at game start.
impact_gain=80.0
impact_decay_ms=150
; VehicleSpeed is 0..1 of the car's top speed. Multiply to get m/s, then
; calibrate against the in-game speedo (m/s = km/h / 3.6).
speed_scale=55.0

[ue4]
enabled=1
; UProperty names on the HUD widget (found by name via reflection).
rpm=VehicleCurrentRPM
maxrpm=VehicleMaxRPM
speed=VehicleCurrentSpeed
gear=VehicleCurrentGear
; raw speed -> m/s. 0.2777 assumes km/h; use 1.0 if the game already stores m/s.
speed_scale=0.27778
gear_offset=0
[triple]
; Triple screens through UE4's emulated stereo renderer: three projected views in one window.
; auto = on when the display is three screens wide (Surround, or three equal monitors side by
; side, which get one borderless window across them); on; off.
mode=auto
; game = the centre screen keeps the game camera's field of view and the sides continue it;
; rig = field of view from the measured rig below.
fov=game
; Rig geometry: one panel's visible size, the side panels' angle, the gap between panels.
panel_width_mm=708.4
panel_height_mm=398.5
side_angle=70
bezel_mm=8
; Used only with fov=rig: eye-to-centre-screen distance (0 = from vertical_fov).
eye_distance_mm=0
vertical_fov=58.715
; Menus and loading screens on the centre screen with black sides (side views only in a race).
menu_sides_black=1
; HUD and menus laid out on the centre screen.
ui_centre=1
